name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  checks:
    # Fork PRs run on a GitHub-hosted runner: their `npm ci` and test run is
    # untrusted code, and the Sengi runner should not be spending itself on
    # strangers' commits. GitHub-hosted minutes are free on public repos, so
    # this costs nothing; pushes and same-repo PRs keep the fast Sengi runner.
    # `full_name` is null for a deleted fork, which also lands on the hosted
    # runner — the fail-safe direction.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'sengi-standard-4-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Prompt-adapter tests open a POSIX pty via python3. Not a runtime
      # dependency of setup or the Worker.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Both dry-runs bundle the Worker without credentials: the portable
      # defaults a fresh clone gets, and the tracked production profile.
      - name: Dry-run deploy (portable defaults)
        run: npm run check:bundle
      - name: Dry-run deploy (production profile)
        run: npm run deploy:production -- --dry-run

# Deploys are NOT done here. Cloudflare Workers Builds (the dashboard git
# integration) builds and deploys main on push, gated on the same checks via
# its build command — see DEPLOY.md "CI / automated deploys".
